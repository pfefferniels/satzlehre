<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historische Satzlehre · 2. Sitzung</title>
  <link rel="stylesheet" href="../vendor/reveal/reset.css">
  <link rel="stylesheet" href="../vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../css/satzlehre.css">
</head>
<body>
<div class="reveal">
<div class="slides">

  <section data-background-image="../img/kunst-caravaggio-eidechse.jpg" data-background-size="contain" data-background-color="#000000">
    <aside class="notes">
      Caravaggio, Knabe, von einer Eidechse gebissen, um 1594–96, Florenz, Fondazione Roberto Longhi. Bild: Wikimedia Commons, gemeinfrei.
    </aside>
  </section>

  <section class="title">
    <p class="kicker">Universität Tübingen · WiSe 2026/27</p>
    <h2>Historische Satzlehre</h2>
    <p class="meta">2. Sitzung // 28.10.2026 // Niels Pfeffer</p>
  </section>

  <section class="divider">
    <h2>Hausaufgaben</h2>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-mi.svg" style="--units: 1599" alt="Zweistimmiges Kyrie – Christe – Kyrie über einem Bass, die Kyrie-Abschnitte schließen in mi mit dis' – e' über h – e">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-c.svg" style="--units: 2079" alt="Zweistimmiges Kyrie – Christe – Kyrie für Sopran und Alt, alle drei Abschnitte schließen auf c">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-breven.svg" style="--units: 1881" alt="Zweistimmiges Kyrie – Christe – Kyrie, Tenor in Breven, Sopran darüber, mit Intervallziffern an den Schlüssen">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-note-gegen-note.svg" style="--units: 2020; --scale: 0.39" alt="Dreistimmiges Kyrie – Christe – Kyrie Note gegen Note, Kyrie auf d, Christe auf f">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-tripla.svg" style="--units: 1415" alt="Dreistimmiges Kyrie eleison im Dreihalbetakt, Schluss auf d">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-orbis-factor.svg" style="--units: 2561" alt="Kyrie – Christe – Kyrie über dem Choral Kyrie XI „Orbis factor“ im Tenor, darüber der Contratenor, im Christe geteilt">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-vorhalte.svg" style="--units: 2044" alt="Vierstimmiges Kyrie – Christe – Kyrie auf zwei Systemen, mit Vorhalten im Cantus">
    </div>
  </section>

  <section>
    <div class="homework solo">
      <img src="../img/hausaufgabe-tuebingen-kyrie-imitation.svg" style="--units: 3116; --scale: 0.33" alt="Vierstimmiges Kyrie – Christe – Kyrie mit nacheinander einsetzenden Stimmen">
    </div>
  </section>

</div>
</div>

<script src="../vendor/reveal/reveal.js"></script>
<script src="../vendor/reveal/plugin/notes.js"></script>
<script src="../vendor/reveal/plugin/zoom.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    width: 1280,
    height: 720,
    margin: 0.04,
    center: false,
    transition: "none",
    slideNumber: "c/t",
    plugins: [RevealNotes, RevealZoom],
  });
</script>
</body>
</html>
