<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historische Satzlehre · 3. Sitzung</title>
  <link rel="stylesheet" href="../vendor/reveal/reset.css">
  <link rel="stylesheet" href="../vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../css/satzlehre.css">
</head>
<body>
<div class="reveal">
<div class="slides">

  <section class="title">
    <p class="kicker">Universität Tübingen · WiSe 2026/27</p>
    <h2>Historische Satzlehre</h2>
    <p class="meta">3. Sitzung // 11.11.2026 // Niels Pfeffer</p>
  </section>

  <section>
    <div class="score-only">
      <figure>
        <img class="score" src="../img/kadenz-bass-frage-oktave.svg" alt="Kadenz in fa, Cantus und Tenor, darunter ein leeres Basssystem">
      </figure>
    </div>

    <aside class="notes">
      Dritte Stimme? Sammeln
    </aside>
  </section>

  <section>
    <div class="score-only">
      <figure>
        <img class="score" src="../img/kadenz-bass-v-i-oktave.svg" alt="Kadenz in fa mit Bass: c – f">
      </figure>
    </div>
  </section>

  <section>
    <h2>Varianten im Bass</h2>
    <figure>
      <img class="score pair" src="../img/kadenz-bass-sexte-quinte.svg" alt="Kadenz in fa mit Bass b – c – f, Sextquintklang über b">
      <figcaption>Bass b–c–f: über dem b bilden Tenor und Cantus eine Sexte und eine Quinte.</figcaption>
    </figure>
    <figure>
      <img class="score pair" src="../img/kadenz-bass-trugschluss.svg" alt="Kadenz in fa, Trugschluss mit Bass c – d">
      <figcaption>Trugschluss: der Bass steigt nach d, statt nach f zu fallen.</figcaption>
    </figure>
  </section>

  <section>
    <h2>Kadenz in mi: dritte Stimme?</h2>
    <figure>
      <img class="score" src="../img/kadenz-mi-bass-frage-oktave.svg" alt="Kadenz in mi, Cantus und Tenor, darunter ein leeres Basssystem">
    </figure>
  </section>

  <section>
    <div class="score-only">
      <svg width="440" height="440" viewBox="0 0 100 100" role="img" aria-label="Ein Kreis">
        <circle cx="50" cy="50" r="49" fill="none" stroke="#111827" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <aside class="notes">
      Konzentrisch und exzentrisch
    </aside>
  </section>

</div>
</div>

<script src="../vendor/reveal/reveal.js"></script>
<script src="../vendor/reveal/plugin/notes.js"></script>
<script src="../vendor/reveal/plugin/zoom.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    width: 1280,
    height: 720,
    margin: 0.04,
    center: false,
    transition: "none",
    slideNumber: "c/t",
    plugins: [RevealNotes, RevealZoom],
  });
</script>
</body>
</html>
